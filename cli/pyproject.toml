[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-cli"
version = "0.1.0"
description = "Cortex 终端客户端 —— 双模（remote + local）交互式/脚本化对话 CLI"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "keyring>=25.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# 交互式增强（历史/多行/补全）；缺失时 REPL 回退到基础 input()
repl = ["prompt_toolkit>=3.0"]
# 离线直跑模式：依赖同仓库 backend 包
local = ["cortex-backend"]

[project.scripts]
cortex = "cortex_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex_cli*"]
